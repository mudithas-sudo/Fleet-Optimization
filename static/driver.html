<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FleetOps Driver</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#364152">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     FleetOps Driver — navigator PWA, slate and navy design system
     ============================================================ */
  :root {
    color-scheme: light;

    --bg: #f3f5f7;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --surface-3: #eceff3;
    --border: #e4e8ee;
    --border-strong: #cfd5de;
    --text: #1a2234;
    --text-muted: #5b6577;
    --text-subtle: #667085;

    --primary: #1a2234;
    --primary-hover: #2b3650;
    --on-primary: #ffffff;
    --primary-soft: #e9edf5;
    --accent: #1a2234;
    --accent-hover: #2b3650;
    --on-accent: #ffffff;
    --info: #3a6fd8;
    --nav-bg: #364152;
    --nav-text: #ffffff;

    --success: #16794a;
    --success-soft: #e3f6ec;
    --warning: #9a5b00;
    --danger: #c8372d;

    --focus-ring: 0 0 0 3px rgba(58, 111, 216, .35);
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06), 0 2px 8px rgba(16, 24, 40, .06);
    --shadow-md: 0 4px 14px rgba(16, 24, 40, .12);
    --shadow-lg: 0 12px 34px rgba(16, 24, 40, .2);

    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: var(--font);
    --radius: 10px; --radius-sm: 6px; --radius-full: 999px;
    --dur: .2s; --ease: cubic-bezier(.2, 0, 0, 1);

    /* legacy aliases for shared helpers */
    --panel: var(--surface); --panel-2: var(--surface-2); --line: var(--border);
    --muted: var(--text-muted); --primary-text: var(--on-primary);
    --blue: var(--primary); --blue-soft: var(--primary-soft);
    --green: var(--success); --red: var(--danger);
    --ui: var(--font); --r: var(--radius);
  }
  [data-theme="dark"] {
    color-scheme: dark;

    --bg: #0f1420;
    --surface: #171e2e;
    --surface-2: #1b2335;
    --surface-3: #232d44;
    --border: #2a3550;
    --border-strong: #3a4766;
    --text: #e8ecf4;
    --text-muted: #9aa6bd;
    --text-subtle: #8591aa;

    --primary: #e8ecf4;
    --primary-hover: #ffffff;
    --on-primary: #151c2c;
    --primary-soft: #222d47;
    --accent: #4d7de0;
    --accent-hover: #6a92ec;
    --on-accent: #ffffff;
    --info: #7ea4f2;
    --nav-bg: #1e2638;
    --nav-text: #ffffff;

    --success: #4fcb88;
    --success-soft: #11291e;
    --warning: #e8b04a;
    --danger: #ff7b68;

    --focus-ring: 0 0 0 3px rgba(126, 164, 242, .45);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
    --shadow-md: 0 6px 20px rgba(0, 0, 0, .45);
    --shadow-lg: 0 16px 42px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 14px; font-weight: 600; line-height: 1.5;
    height: 100vh; height: 100dvh; overflow: hidden; position: relative;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }

  .i {
    width: 20px; height: 20px; flex: 0 0 auto;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  /* the map is an oversized square rotated by CSS for heading-up navigation
     — works on every renderer, unlike vector camera heading. The shell traps
     the 3D-transformed map in its own stacking context so the tilted plane
     can never composite above the banner/ETA overlays. */
  #map-shell { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
  #map { position: absolute; inset: 0; will-change: transform; }
  .hidden { display: none !important; }

  /* ---- driver queue ---- */
  #queue {
    position: absolute; inset: 0; z-index: 8; overflow-y: auto;
    background: var(--bg);
    padding: calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
  }
  .q-card { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .q-head { display: flex; align-items: flex-start; gap: 12px; }
  .q-head > div { flex: 1; }
  .q-hi { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .q-veh {
    color: var(--text-muted); font-size: 13px; font-weight: 700; margin-top: 4px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .q-veh .i { width: 16px; height: 16px; }
  .icon-btn {
    width: 40px; height: 40px; flex: 0 0 auto; display: grid; place-items: center;
    background: var(--surface); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: var(--radius-full);
    cursor: pointer; transition: color var(--dur), border-color var(--dur);
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
  #q-runs { display: flex; flex-direction: column; gap: 10px; }
  .q-run {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow-sm);
    padding: 14px 15px; display: flex; align-items: center; gap: 12px;
  }
  .q-run .info { flex: 1; min-width: 0; }
  .q-run .label { font-weight: 800; font-size: 15px; }
  .q-run .meta { color: var(--text-muted); font-size: 12px; font-weight: 600; margin-top: 3px; line-height: 1.5; }
  .q-run .go {
    font-family: inherit; font-size: 14px; font-weight: 800;
    padding: 11px 20px; border-radius: var(--radius-full); border: none; cursor: pointer;
    background: var(--accent); color: var(--on-accent); white-space: nowrap;
    transition: background var(--dur);
  }
  .q-run .go:hover { background: var(--accent-hover); }
  .q-run .go.live { background: var(--success); color: #fff; }
  .q-run.done { opacity: .6; }
  .q-empty {
    color: var(--text-muted); text-align: center; padding: 40px 0; font-weight: 600; line-height: 1.7;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .q-empty .i { width: 30px; height: 30px; color: var(--text-subtle); stroke-width: 1.6; }

  #btn-queue {
    position: absolute; top: calc(94px + env(safe-area-inset-top)); left: 12px; z-index: 6;
    width: 46px; height: 46px; border-radius: 50%; border: none;
    background: var(--surface); color: var(--text);
    box-shadow: var(--shadow-lg); cursor: pointer;
    display: grid; place-items: center;
  }
  #btn-queue .i { width: 20px; height: 20px; }

  /* ---- turn-instruction banner ---- */
  #banner {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px;
    background: var(--nav-bg); color: var(--nav-text); border-radius: 18px;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px; box-shadow: var(--shadow-lg); z-index: 5;
    transform: translateZ(0);
    transition: background .3s;
  }
  #banner.offroute { background: var(--danger); }
  #maneuver-icon { flex: 0 0 auto; width: 44px; height: 44px; }
  #maneuver-icon svg { width: 100%; height: 100%; }
  #banner .txt { min-width: 0; }
  #maneuver-dist {
    font-size: 27px; font-weight: 800; line-height: 1; letter-spacing: -.02em;
  }
  #maneuver-text {
    font-size: 13px; font-weight: 600; opacity: .85; margin-top: 5px; line-height: 1.4;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  /* ---- speed bubble ---- */
  #speed-bubble {
    position: absolute; left: 14px; bottom: calc(104px + env(safe-area-inset-bottom));
    width: 62px; height: 62px; border-radius: 50%; z-index: 5;
    background: var(--surface); border: 3px solid var(--text);
    box-shadow: var(--shadow-lg); cursor: pointer; user-select: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transform: translateZ(0);
  }
  #speed-bubble b { font-size: 19px; font-weight: 800; line-height: 1; }
  #speed-bubble small { font-size: 8px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin-top: 1px; }

  /* ---- deviate button ---- */
  #btn-deviate {
    position: absolute; right: 14px; bottom: calc(104px + env(safe-area-inset-bottom));
    width: 62px; height: 62px; border-radius: 50%; z-index: 5;
    background: var(--surface); color: var(--danger); border: 3px solid var(--danger);
    cursor: pointer; box-shadow: var(--shadow-lg);
    display: grid; place-items: center;
    transform: translateZ(0);
  }
  #btn-deviate .i { width: 26px; height: 26px; }
  #btn-deviate.on { background: var(--danger); color: #fff; animation: pulse .8s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }

  /* ---- stop button (sits above the deviate button) ---- */
  #btn-stop {
    position: absolute; right: 14px; bottom: calc(178px + env(safe-area-inset-bottom));
    width: 62px; height: 62px; border-radius: 50%; z-index: 5;
    background: var(--surface); color: var(--warning); border: 3px solid var(--warning);
    cursor: pointer; box-shadow: var(--shadow-lg);
    display: grid; place-items: center; transform: translateZ(0);
  }
  #btn-stop .i { width: 24px; height: 24px; }
  #btn-stop.on { background: var(--warning); color: #fff; animation: pulse .8s infinite; }

  /* ---- ETA bar ---- */
  #eta-bar {
    position: absolute; left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5;
    background: var(--surface); border-radius: var(--radius-full); box-shadow: var(--shadow-lg);
    display: flex; align-items: center; gap: 8px; padding: 9px 11px;
    transform: translateZ(0);
  }
  .round-btn {
    width: 46px; height: 46px; border-radius: 50%; flex: 0 0 auto;
    background: var(--surface-2); color: var(--text); border: none;
    cursor: pointer; display: grid; place-items: center;
    transition: background var(--dur);
  }
  .round-btn:hover { background: var(--surface-3); }
  .round-btn .i { width: 19px; height: 19px; }
  #eta-center { flex: 1; text-align: center; min-width: 0; }
  #eta-time {
    font-size: 23px; font-weight: 800; color: var(--success); line-height: 1; letter-spacing: -.02em;
  }
  #eta-sub { display: block; color: var(--text-muted); font-size: 12px; font-weight: 700; margin-top: 3px; }

  /* ---- pre-trip bottom sheet ---- */
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    background: var(--surface); border-radius: 24px 24px 0 0;
    box-shadow: 0 -8px 34px rgba(0, 0, 0, .22);
    border-top: 1px solid var(--border);
    padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px;
  }
  .grab { width: 42px; height: 5px; border-radius: 3px; background: var(--border-strong); margin: 0 auto; }
  .head { display: flex; align-items: center; gap: 10px; }
  .brand {
    font-size: 18px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap;
    display: flex; align-items: center;
  }
  .brand .logo {
    width: 24px; height: 24px; border-radius: 7px; margin-right: 8px;
    background: var(--primary); color: var(--on-primary); display: grid; place-items: center;
  }
  .brand .logo .i { width: 15px; height: 15px; stroke-width: 2.2; }
  .brand em { font-style: normal; color: var(--primary); }
  #trip-meta {
    color: var(--text-muted); font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  #trip-meta .i { width: 15px; height: 15px; }
  #theme-toggle {
    margin-left: auto;
    width: 38px; height: 38px; flex: 0 0 auto; display: grid; place-items: center;
    background: var(--surface-2); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: var(--radius-full); cursor: pointer;
    transition: color var(--dur), border-color var(--dur);
  }
  #theme-toggle:hover { color: var(--text); border-color: var(--border-strong); }
  #theme-toggle .i { width: 18px; height: 18px; }
  #briefing {
    background: var(--primary-soft); padding: 12px 14px; line-height: 1.6;
    border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 600;
    border: 1px solid color-mix(in srgb, var(--primary) 22%, transparent);
    max-height: 104px; overflow-y: auto;
  }
  .speed-row { display: flex; align-items: center; gap: 12px; }
  .speed-row label {
    font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted);
  }
  input[type=range] { flex: 1; accent-color: var(--primary); }
  #speed-val { font-weight: 800; min-width: 74px; text-align: right; font-size: 13px; }
  #btn-start {
    font-family: inherit; font-size: 16px; font-weight: 800;
    padding: 16px; border-radius: var(--radius-full); border: none; cursor: pointer;
    background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-sm);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: background var(--dur);
  }
  #btn-start:hover:not(:disabled) { background: var(--accent-hover); }
  #btn-start:disabled { opacity: .45; }
  #btn-start svg { width: 18px; height: 18px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }

  /* ============================================================
     Harbour-chart refinements (override layer)
     ============================================================ */
  button, input, select, textarea { font-family: var(--font); }
  #eta-time, #maneuver-dist, #speed-bubble b { font-variant-numeric: tabular-nums; }

  .brand { font-family: var(--display); font-weight: 700; letter-spacing: -.03em; }
  .brand .logo { background: var(--nav-bg); color: #fff; border-radius: var(--radius-sm); }
  .brand em { color: var(--info); }
  .q-hi { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; }

  /* turn banner: harbour ink, the distance is the one loud thing on screen */
  #banner { background: var(--nav-bg); border-radius: var(--radius); }
  #maneuver-dist { font-family: var(--display); font-size: 34px; font-weight: 700; color: #fff; letter-spacing: -.02em; }
  #maneuver-text { font-size: 14px; font-weight: 600; opacity: .92; }

  #eta-bar { border-radius: var(--radius); }
  #eta-time { font-family: var(--display); font-size: 26px; font-weight: 700; }
  .round-btn { border-radius: var(--radius-sm); }
  #sheet { border-radius: 16px 16px 0 0; box-shadow: 0 -6px 24px rgba(10, 28, 33, .18); }

  /* queue rows: a status rail, squarer corners */
  .q-run { border-radius: var(--radius); border-left: 4px solid var(--info); box-shadow: none; }
  .q-run.done { border-left-color: var(--border-strong); }
  .q-run .go, #btn-start { border-radius: var(--radius); font-family: var(--font); font-weight: 600; box-shadow: none; }
  .q-run .go.live { background: var(--success); color: #fff; }
  #theme-toggle, .icon-btn, #btn-queue { border-radius: var(--radius); }

  /* sentence-case small labels */
  .speed-row label { text-transform: none; letter-spacing: 0; font-size: 12px; }
  #speed-bubble small { text-transform: none; letter-spacing: 0; font-size: 10px; }

  /* ---- my stops: delivery confirmation sheet ---- */
  #stops-sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; max-height: 86dvh;
    background: var(--bg); border-radius: 16px 16px 0 0; border-top: 1px solid var(--border);
    box-shadow: 0 -8px 30px rgba(10, 28, 33, .28);
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #stops-sheet.hidden { display: none; }
  .stops-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  .stops-head h2 { font: 700 20px var(--display); letter-spacing: -.02em; flex: 1; }
  .stops-head small { color: var(--text-muted); font-weight: 700; font-size: 13px; }
  #stops-body { overflow-y: auto; padding: 0 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .stop-card { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--primary); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 3px; }
  .stop-card.done { border-left-color: var(--success); }
  .stop-card.failed { border-left-color: var(--danger); }
  .stop-card.collect { border-left-color: var(--warning); }
  .stop-top { display: flex; align-items: center; gap: 8px; }
  .stop-n { width: 24px; height: 24px; border-radius: var(--radius-sm); background: var(--nav-bg); color: var(--nav-text); display: grid; place-items: center; font: 700 13px var(--display); }
  .stop-chip { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--primary); }
  .done .stop-chip { color: var(--success); }
  .failed .stop-chip { color: var(--danger); }
  .collect .stop-chip { color: var(--warning); }
  .stop-name { font-weight: 700; }
  .stop-line { font-size: 13.5px; color: var(--text-muted); font-weight: 600; }
  .stop-line a { color: var(--primary); }
  .stop-note { font-size: 13px; color: var(--text); background: var(--surface-2); border-radius: var(--radius-sm); padding: 6px 8px; margin-top: 4px; font-weight: 600; }
  .stop-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .stop-actions:empty { display: none; }
  .stop-btn { flex: 1; min-height: 46px; font: 700 15px var(--display); border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; padding: 0 14px; }
  .stop-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .stop-btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .stop-btn:disabled { opacity: .5; }
  .stop-form { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .stop-form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; }
  .stop-form input:not([type=radio]):not([type=file]) { min-height: 44px; padding: 0 12px; border: 1.5px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--text); font: 600 15px var(--font); }
  .stop-form input:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus-ring); }
  .stop-form .seg { display: flex; gap: 6px; }
  .stop-form .seg button { flex: 1; min-height: 44px; border-radius: var(--radius); border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text-muted); font: 700 14px var(--font); }
  .stop-form .seg button.active { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .stop-label { font-size: 13px; font-weight: 700; }
  .stop-label span { color: var(--text-muted); font-weight: 600; }
  #sd-sign { width: 100%; height: 120px; background: #fff; border: 1.5px dashed var(--border-strong); border-radius: var(--radius); }
  #sd-thumb { max-width: 100%; max-height: 140px; border-radius: var(--radius-sm); align-self: flex-start; }
  .stop-row { display: flex; gap: 8px; align-items: center; }
  .stop-link, .stop-photo { background: none; border: 0; color: var(--primary); font: 700 14px var(--font); cursor: pointer; padding: 8px 0; }
  .stop-photo { margin-left: auto; flex-direction: row; }
  .stop-radio { flex-direction: row !important; align-items: center; gap: 10px !important; min-height: 44px; padding: 0 10px; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--surface); font-weight: 600 !important; font-size: 15px !important; }
  .stop-radio input { width: 20px; height: 20px; accent-color: var(--primary); }
  .stop-err { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; font-weight: 700; }

  /* next stop: the biggest thing on the sheet (large, one-handed targets) */
  .stop-card.next { border-left-width: 6px; border-color: var(--info); background: var(--primary-soft); }
  .stop-next-tag { font: 700 12px var(--font); color: var(--info); }
  .stop-card.next .stop-name { font-size: 17px; }
  .stop-card.next .stop-line { font-size: 15px; color: var(--text); }
  .stop-card.next .stop-btn { min-height: 56px; font-size: 16px; }
  .stop-contact { display: flex; gap: 8px; margin-top: 6px; }
  .stop-big { flex: 1; min-height: 48px; display: grid; place-items: center; border-radius: var(--radius); border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text) !important; font: 700 15px var(--font); text-decoration: none !important; }
</style>
</head>
<body>
<div id="map-shell"><div id="map"></div></div>

<!-- per-driver queue view (driver.html?driver=<id>) -->
<div id="queue" class="hidden">
  <div class="q-card">
    <div class="q-head">
      <div>
        <div class="q-hi">Hi <span id="q-name">…</span></div>
        <div class="q-veh" id="q-vehicle"></div>
      </div>
      <button id="theme-toggle-q" class="icon-btn" type="button" aria-label="Switch theme"></button>
    </div>
    <div id="q-runs"></div>
  </div>
</div>

<button id="btn-queue" class="hidden" type="button" aria-label="Back to my runs" title="Back to my runs">
  <svg viewBox="0 0 24 24" class="i" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
</button>

<div id="banner" class="hidden" role="status" aria-live="polite">
  <div id="maneuver-icon" aria-hidden="true"></div>
  <div class="txt">
    <div id="maneuver-dist">–</div>
    <div id="maneuver-text">–</div>
  </div>
</div>

<div id="speed-bubble" class="hidden" role="button" tabindex="0" title="Tap to change simulated speed" aria-label="Simulated speed, tap to change">
  <b id="speed-cur">50</b><small>km/h</small>
</div>
<button id="btn-stop" class="hidden" type="button" aria-label="Simulate the vehicle stopping" aria-pressed="false" title="Simulate stopping (not traffic)">
  <svg viewBox="0 0 24 24" class="i" aria-hidden="true" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
</button>
<button id="btn-deviate" class="hidden" type="button" aria-label="Simulate going off-route" aria-pressed="false">
  <svg viewBox="0 0 24 24" class="i" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20Z"/><path d="M12 9v5"/><path d="M12 17.5h.01"/></svg>
</button>

<div id="eta-bar" class="hidden">
  <button id="btn-end" class="round-btn" type="button" aria-label="End navigation">
    <svg viewBox="0 0 24 24" class="i" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div id="eta-center">
    <b id="eta-time">–</b>
    <span id="eta-sub">– min · – km</span>
  </div>
  <button id="btn-stops" class="round-btn" type="button" aria-label="My stops" title="My stops">
    <svg viewBox="0 0 24 24" class="i" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
  </button>
  <button id="btn-overview" class="round-btn" type="button" aria-label="Toggle route overview">
    <svg viewBox="0 0 24 24" class="i" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 6 2 6-2v14l-6 2-6-2-6 2V6z"/><path d="M9 4v14M15 6v14"/></svg>
  </button>
</div>

<div id="stops-sheet" class="hidden" role="dialog" aria-label="My stops">
  <div class="stops-head">
    <h2>My stops</h2><small id="stops-count"></small>
    <button id="stops-close" class="round-btn" type="button" aria-label="Close my stops">
      <svg viewBox="0 0 24 24" class="i" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="stops-body"></div>
</div>

<div id="sheet">
  <div class="grab"></div>
  <div class="head">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="i" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h13V6H3zM16 10h4l1 4v3h-5"/><circle cx="7.5" cy="17.5" r="2"/><circle cx="17.5" cy="17.5" r="2"/></svg>
      </span>
      Fleet<em>Ops</em> Driver
    </div>
    <div id="trip-meta">loading…</div>
    <button id="theme-toggle" type="button" aria-label="Switch theme"></button>
  </div>
  <div id="briefing">Waiting for trip…</div>
  <div class="speed-row">
    <label for="speed">Sim speed</label>
    <input type="range" id="speed" min="20" max="120" step="10" value="50">
    <span id="speed-val" aria-hidden="true">50 km/h</span>
  </div>
  <button id="btn-start" type="button" disabled>
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 L19 21 L12 17 L5 21 Z"/></svg>
    Start trip
  </button>
</div>

<script src="/static/js/maps-loader.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/stops.js"></script>
<script src="/static/js/driver.js"></script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js");
</script>
</body>
</html>
