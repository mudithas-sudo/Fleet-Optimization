<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FleetOps Driver</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f6;
    --panel: #ffffff;
    --panel-2: #f6f7f8;
    --line: #e8eaed;
    --text: #131619;
    --muted: #6b7177;
    --primary: #131619;
    --primary-text: #ffffff;
    --blue: #276ef1;
    --blue-soft: #eef4fe;
    --green: #05944f;
    --red: #e11900;
    --nav-bg: #131619;         /* instruction banner */
    --nav-text: #ffffff;
    --shadow-sm: 0 1px 2px rgba(19,22,25,.06), 0 2px 8px rgba(19,22,25,.05);
    --shadow-lg: 0 4px 12px rgba(19,22,25,.12), 0 12px 32px rgba(19,22,25,.14);
    --display: "Archivo", sans-serif;
    --ui: "Manrope", sans-serif;
    --r: 14px;
  }
  [data-theme="dark"] {
    --bg: #0e1013;
    --panel: #16181d;
    --panel-2: #1d2025;
    --line: #2a2e34;
    --text: #e8eaed;
    --muted: #8b9198;
    --primary: #e8eaed;
    --primary-text: #131619;
    --blue: #5b93ff;
    --blue-soft: #17213a;
    --green: #2fb673;
    --red: #ff5c47;
    --nav-bg: #1d2025;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--ui); font-size: 13.5px; font-weight: 600;
    height: 100vh; height: 100dvh; overflow: hidden; position: relative;
    -webkit-font-smoothing: antialiased;
  }
  /* the map is an oversized square (viewport diagonal, set by JS) rotated by
     CSS for heading-up navigation — works on every renderer, unlike vector
     camera heading. The shell traps the 3D-transformed map in its own
     stacking context so the tilted plane can never composite above the
     banner/ETA overlays. */
  #map-shell { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
  #map {
    position: absolute; inset: 0;
    will-change: transform; /* rotation is driven per-frame by JS, no CSS transition */
  }
  .hidden { display: none !important; }

  /* ---- driver queue ---- */
  #queue {
    position: absolute; inset: 0; z-index: 8; overflow-y: auto;
    background: var(--bg); padding: 18px;
  }
  .q-card { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .q-head { display: flex; align-items: flex-start; gap: 10px; }
  .q-head > div { flex: 1; }
  .q-hi { font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
  .q-veh { color: var(--muted); font-size: 13px; font-weight: 700; margin-top: 3px; }
  #theme-toggle-q {
    font-family: var(--ui); font-size: 11px; font-weight: 800;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; cursor: pointer;
  }
  #q-runs { display: flex; flex-direction: column; gap: 10px; }
  .q-run {
    background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow-sm);
    padding: 14px 15px; display: flex; align-items: center; gap: 12px;
  }
  .q-run .info { flex: 1; min-width: 0; }
  .q-run .label { font-weight: 800; font-size: 14px; }
  .q-run .meta { color: var(--muted); font-size: 11.5px; font-weight: 600; margin-top: 3px; }
  .q-run .go {
    font-family: var(--ui); font-size: 13px; font-weight: 800;
    padding: 10px 18px; border-radius: 999px; border: none; cursor: pointer;
    background: var(--primary); color: var(--primary-text); white-space: nowrap;
  }
  .q-run .go.live { background: var(--green); color: #fff; }
  .q-run.done { opacity: .6; }
  .q-empty { color: var(--muted); text-align: center; padding: 30px 0; font-weight: 600; line-height: 1.7; }

  #btn-queue {
    position: absolute; top: calc(96px + env(safe-area-inset-top)); left: 12px; z-index: 6;
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--panel); color: var(--text); font-size: 17px;
    box-shadow: var(--shadow-lg); cursor: pointer;
  }

  /* ---- turn-instruction banner ---- */
  #banner {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px;
    background: var(--nav-bg); color: var(--nav-text); border-radius: 16px;
    display: flex; align-items: center; gap: 15px;
    padding: 14px 18px; box-shadow: var(--shadow-lg); z-index: 5;
    transform: translateZ(0);   /* own layer, always above the 3D map */
    transition: background .3s;
  }
  #banner.offroute { background: var(--red); }
  #maneuver-icon { flex: 0 0 auto; width: 42px; height: 42px; }
  #maneuver-icon svg { width: 100%; height: 100%; }
  #banner .txt { min-width: 0; }
  #maneuver-dist {
    font-family: var(--display); font-size: 27px; font-weight: 800;
    line-height: 1; letter-spacing: -.5px;
  }
  #maneuver-text {
    font-size: 13px; font-weight: 600; opacity: .85; margin-top: 5px; line-height: 1.4;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  /* ---- speed bubble ---- */
  #speed-bubble {
    position: absolute; left: 14px; bottom: calc(104px + env(safe-area-inset-bottom));
    width: 60px; height: 60px; border-radius: 50%; z-index: 5;
    background: var(--panel); border: 3px solid var(--text);
    box-shadow: var(--shadow-lg); cursor: pointer; user-select: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transform: translateZ(0);
  }
  #speed-bubble b { font-family: var(--display); font-size: 19px; font-weight: 800; line-height: 1; }
  #speed-bubble small { font-size: 8px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin-top: 1px; }

  /* ---- deviate button ---- */
  #btn-deviate {
    position: absolute; right: 14px; bottom: calc(104px + env(safe-area-inset-bottom));
    width: 60px; height: 60px; border-radius: 50%; z-index: 5;
    background: var(--panel); color: var(--red); border: 3px solid var(--red);
    font-size: 22px; cursor: pointer; box-shadow: var(--shadow-lg);
    transform: translateZ(0);
  }
  #btn-deviate.on { background: var(--red); color: #fff; animation: pulse .8s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }

  /* ---- ETA bar ---- */
  #eta-bar {
    position: absolute; left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5;
    background: var(--panel); border-radius: 999px; box-shadow: var(--shadow-lg);
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    transform: translateZ(0);
  }
  .round-btn {
    width: 46px; height: 46px; border-radius: 50%; flex: 0 0 auto;
    background: var(--panel-2); color: var(--text); border: none;
    font-size: 17px; font-weight: 700; cursor: pointer;
  }
  #eta-center { flex: 1; text-align: center; min-width: 0; }
  #eta-time {
    font-family: var(--display); font-size: 23px; font-weight: 800;
    color: var(--green); line-height: 1; letter-spacing: -.4px;
  }
  #eta-sub { display: block; color: var(--muted); font-size: 11.5px; font-weight: 700; margin-top: 3px; }

  /* ---- pre-trip bottom sheet ---- */
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    background: var(--panel); border-radius: 22px 22px 0 0;
    box-shadow: 0 -8px 32px rgba(0,0,0,.2);
    padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px;
  }
  .grab { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
  .head { display: flex; align-items: center; gap: 10px; }
  .brand {
    font-family: var(--display); font-size: 18px; font-weight: 800;
    letter-spacing: -.4px; white-space: nowrap;
  }
  .brand em { font-style: normal; color: var(--blue); }
  #trip-meta { color: var(--muted); font-size: 11.5px; font-weight: 700; }
  #theme-toggle {
    font-family: var(--ui); font-size: 11px; font-weight: 800; margin-left: auto;
    background: var(--panel-2); color: var(--muted);
    border: none; border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  #briefing {
    background: var(--blue-soft); padding: 12px 14px; line-height: 1.6;
    border-radius: var(--r); font-size: 12.5px; font-weight: 600;
    max-height: 104px; overflow-y: auto;
  }
  .speed-row { display: flex; align-items: center; gap: 12px; }
  .speed-row label {
    font-size: 10.5px; font-weight: 800; letter-spacing: .6px;
    text-transform: uppercase; color: var(--muted);
  }
  input[type=range] { flex: 1; accent-color: var(--text); }
  #speed-val { font-weight: 800; min-width: 74px; text-align: right; font-size: 13px; }
  #btn-start {
    font-family: var(--ui); font-size: 16px; font-weight: 800;
    padding: 16px; border-radius: 999px; border: none; cursor: pointer;
    background: var(--primary); color: var(--primary-text); box-shadow: var(--shadow-sm);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .05s;
  }
  #btn-start:active { transform: scale(.985); }
  #btn-start:disabled { opacity: .4; }
  #btn-start svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div id="map-shell"><div id="map"></div></div>

<!-- per-driver queue view (driver.html?driver=<id>) -->
<div id="queue" class="hidden">
  <div class="q-card">
    <div class="q-head">
      <div>
        <div class="q-hi">Hi <span id="q-name">…</span> 👋</div>
        <div class="q-veh" id="q-vehicle"></div>
      </div>
      <button id="theme-toggle-q"></button>
    </div>
    <div id="q-runs"></div>
  </div>
</div>

<button id="btn-queue" class="hidden" title="Back to my runs">☰</button>

<div id="banner" class="hidden">
  <div id="maneuver-icon"></div>
  <div class="txt">
    <div id="maneuver-dist">–</div>
    <div id="maneuver-text">–</div>
  </div>
</div>

<div id="speed-bubble" class="hidden" title="Tap to change simulated speed">
  <b id="speed-cur">50</b><small>km/h</small>
</div>
<button id="btn-deviate" class="hidden" title="Simulate going off-route">⚠</button>

<div id="eta-bar" class="hidden">
  <button id="btn-end" class="round-btn" title="End navigation">✕</button>
  <div id="eta-center">
    <b id="eta-time">–</b>
    <span id="eta-sub">– min · – km</span>
  </div>
  <button id="btn-overview" class="round-btn" title="Route overview">▦</button>
</div>

<div id="sheet">
  <div class="grab"></div>
  <div class="head">
    <div class="brand">Fleet<em>Ops</em> Driver</div>
    <div id="trip-meta">loading…</div>
    <button id="theme-toggle">☾ Dark</button>
  </div>
  <div id="briefing">Waiting for trip…</div>
  <div class="speed-row">
    <label>Sim speed</label>
    <input type="range" id="speed" min="20" max="120" step="10" value="50">
    <span id="speed-val">50 km/h</span>
  </div>
  <button id="btn-start" disabled>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L19 21 L12 17 L5 21 Z"/></svg>
    Start trip
  </button>
</div>

<script src="/static/js/maps-loader.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/driver.js"></script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js");
</script>
</body>
</html>
