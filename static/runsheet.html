<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f7; --surface: #ffffff; --border: #e6e2ec;
    --text: #17062a; --muted: #5d5470; --primary: #6a2fb0; --accent: #6a2fb0;
    --danger: #dd1311; --success: #00854a; --warning: #9a5b00;
    --font: "Inter", system-ui, sans-serif;
    --display: var(--font);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 500 14px/1.5 var(--font); padding: 24px; }
  main { max-width: 1040px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); padding: 28px; }
  h1 { font: 700 26px var(--display); letter-spacing: -.02em; }
  .sub { color: var(--muted); margin-top: 4px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 18px 0 22px; }
  .facts div { min-width: 120px; }
  .facts b { display: block; font: 700 18px var(--display); }
  .facts span { color: var(--muted); font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 700; font-size: 12.5px; color: var(--muted); padding: 8px 6px; border-bottom: 2px solid var(--text); }
  td { padding: 9px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hub td { background: #e7ece8; font-weight: 700; }
  .kind { font-weight: 700; }
  .kind.pickup { color: var(--warning); }
  .kind.delivery { color: var(--primary); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 3px; background: #f9e3df; color: var(--danger); margin-left: 4px; }
  .tag.ok { background: #dfeee5; color: var(--success); }
  .small { color: var(--muted); font-size: 12.5px; }
  .actions { margin-top: 20px; display: flex; gap: 10px; }
  button { font: 700 14px var(--display); background: var(--accent); color: #ffffff; border: 0; border-radius: 6px; padding: 10px 18px; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .sign { margin-top: 36px; display: flex; gap: 40px; }
  .sign div { flex: 1; border-top: 1px solid var(--text); padding-top: 6px; color: var(--muted); font-size: 12.5px; }
  @media print {
    body { background: #fff; padding: 0; }
    main { border: 0; padding: 0; max-width: none; }
    .actions { display: none; }
  }
</style>
</head>
<body>
<main id="sheet" aria-live="polite">Loading run sheet…</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtTime = ts => ts ? new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "–";
const fmtKm = m => (m / 1000).toFixed(1) + " km";
const fmtMin = s => { const m = Math.round(s / 60); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };

async function get(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function main() {
  const tripId = new URLSearchParams(location.search).get("trip");
  if (!tripId) { $("sheet").textContent = "Open this page from a run in the dispatch console."; return; }
  const [trip, parcelList, drivers, vehicles] = await Promise.all([
    get(`/api/trips/${encodeURIComponent(tripId)}`), get("/api/parcels"), get("/api/drivers"), get("/api/vehicles"),
  ]);
  const parcels = Object.fromEntries(parcelList.map(p => [p.id, p]));
  const driver = drivers.find(d => d.id === trip.driverId);
  const vehicle = vehicles.find(v => v.id === trip.vehicleId);
  const etas = {};
  (trip.plannedEtaPerStop || []).forEach(e => { etas[e.stopIndex] = e; });
  const stops = trip.route.orderedStops;
  const totals = trip.route.totals || {};
  const dist = trip.route.totalDistanceMeters ?? totals.distanceMeters;
  const dur = trip.route.totalDurationSeconds ?? totals.durationSeconds;
  const load = (trip.parcelIds || []).map(id => parcels[id]).filter(Boolean);
  const kg = load.reduce((a, p) => a + (p.weightKg || 0), 0);

  const last = stops[stops.length - 1];
  const runLabel = `${stops[0].label} → ${last.place || last.label}`;
  let seq = 0;
  const rows = stops.map((s, i) => {
    const e = etas[i];
    if (s.depot || s.kind === "depot") {
      return `<tr class="hub"><td class="n">Start</td><td colspan="5">${esc(s.label)} (hub)</td><td class="n">${fmtTime(trip.createdAt)}</td></tr>`;
    }
    const p = parcels[s.parcelId] || {};
    seq += 1;
    const kind = s.kind === "pickup" ? "pickup" : "delivery";
    const dims = p.dimensionsCm ? `${p.dimensionsCm.l}×${p.dimensionsCm.w}×${p.dimensionsCm.h} cm` : "";
    const detail = [p.size, dims, p.weightKg ? p.weightKg + " kg" : "", p.fragile ? "fragile" : ""].filter(Boolean).join(" · ");
    const status = p.status === "delivered" ? `<span class="tag ok">delivered</span>` : p.deadlineMissed ? `<span class="tag">late</span>` : "";
    return `<tr>
      <td class="n">${seq}</td>
      <td><span class="kind ${kind}">${kind === "pickup" ? "Collect" : "Deliver"}</span></td>
      <td><b>${esc(p.trackingNumber || s.parcelName || "")}</b><div class="small">${esc(detail)}</div></td>
      <td>${esc(p.receiverName || "")}<div class="small">${esc(p.recipientPhone || "")}</div></td>
      <td>${esc(s.place || s.label)}${p.notes ? `<div class="small">${esc(p.notes)}</div>` : ""}</td>
      <td>${status}</td>
      <td class="n">${e ? fmtTime(e.eta) : "–"}${e && e.atRisk ? `<span class="tag">at risk</span>` : ""}</td>
    </tr>`;
  }).join("");

  document.title = `Run sheet — ${driver ? driver.name : trip.id}`;
  $("sheet").innerHTML = `
    <h1>Run sheet</h1>
    <div class="sub">${esc(runLabel)} · ${new Date((trip.createdAt || Date.now() / 1000) * 1000).toLocaleDateString()}</div>
    <div class="facts">
      <div><b>${esc(driver ? driver.name : "Unassigned")}</b><span>Driver${driver && driver.phone ? " · " + esc(driver.phone) : ""}</span></div>
      <div><b>${esc(vehicle ? vehicle.name : "–")}</b><span>${esc(vehicle ? (vehicle.plate || vehicle.type) : "")}</span></div>
      <div><b>${load.length}</b><span>Parcels${kg ? " · " + kg.toFixed(1) + " kg" : ""}</span></div>
      <div><b>${dist != null ? fmtKm(dist) : "–"}</b><span>Planned distance</span></div>
      <div><b>${dur != null ? fmtMin(dur) : "–"}</b><span>Drive time</span></div>
    </div>
    <table>
      <thead><tr><th>#</th><th>Action</th><th>Tracking no. and package</th><th>Receiver</th><th>Address</th><th>Status</th><th>ETA</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="sign"><div>Driver signature</div><div>Dispatcher signature</div></div>
    <div class="actions">
      <button type="button" id="print">Print run sheet</button>
      <button type="button" class="ghost" onclick="location.reload()">Refresh status</button>
    </div>`;
  $("print").onclick = () => window.print();
}

main().catch(e => { $("sheet").textContent = "Couldn't load the run sheet: " + e.message; });
</script>
</body>
</html>
